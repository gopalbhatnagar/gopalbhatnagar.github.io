name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install game dependencies
        working-directory: game
        run: npm ci

      - name: Build game bundle
        working-directory: game
        run: npm run build

      - name: Install game2 dependencies
        working-directory: game2
        run: npm ci

      - name: Build game2 bundle
        working-directory: game2
        run: npm run build

      - name: Remove local install artifacts
        run: |
          rm -rf game/node_modules
          rm -rf game/.vite
          rm -rf game2/node_modules
          rm -rf game2/.vite

      - name: Prepare Pages deployment folder
        run: |
          mkdir -p .site/game .site/game2
          cp index.html .site/index.html
          cp Gopal_Bhatnagar_Resume.pdf .site/Gopal_Bhatnagar_Resume.pdf
          cp -R game/dist/. .site/game/dist/
          cp -R game2/dist/. .site/game2/dist/
          cp .nojekyll .site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
